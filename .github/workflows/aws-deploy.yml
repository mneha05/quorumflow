name: Deploy AWS substrate

on:
  workflow_dispatch:
  push:
    paths:
      - "infra/aws/**"
      - ".github/workflows/aws-deploy.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: quorumflow-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Detect AWS authentication
        id: auth
        shell: bash
        run: |
          if [[ -n "$AWS_ROLE_ARN" ]]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "mode=static" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "mode=missing" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No AWS_ROLE_ARN or AWS access-key secrets are configured; Terraform apply is skipped."
          fi

      - name: Show GitHub OIDC claims
        if: steps.auth.outputs.mode == 'oidc'
        shell: bash
        run: |
          RESPONSE="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$RESPONSE")"
          PAYLOAD="$(cut -d. -f2 <<<"$TOKEN")"
          python - "$PAYLOAD" <<'PY'
          import base64, json, sys
          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print("OIDC sub:", claims.get("sub"))
          print("OIDC aud:", claims.get("aud"))
          print("OIDC repository:", claims.get("repository"))
          print("OIDC ref:", claims.get("ref"))
          PY

      - name: Configure AWS through GitHub OIDC
        if: steps.auth.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        if: steps.auth.outputs.ready == 'true'
        run: |
          aws sts get-caller-identity | tee aws-identity.json
          echo "### AWS identity" >> "$GITHUB_STEP_SUMMARY"
          echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
          cat aws-identity.json >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform init
        if: steps.auth.outputs.ready == 'true'
        working-directory: infra/aws
        run: terraform init

      - name: Recover existing AWS resources into Terraform state
        if: steps.auth.outputs.ready == 'true'
        working-directory: infra/aws
        shell: bash
        run: |
          set -euo pipefail

          BUCKET="$(aws s3api list-buckets             --query "Buckets[?starts_with(Name, 'quorumflow-lake-')] | sort_by(@, &CreationDate)[-1].Name"             --output text)"
          if [[ -n "$BUCKET" && "$BUCKET" != "None" ]]; then
            terraform import -var="region=$AWS_REGION" aws_s3_bucket.lake "$BUCKET"
            terraform import -var="region=$AWS_REGION" aws_s3_bucket_versioning.lake "$BUCKET"
          fi

          if aws dynamodb describe-table --table-name quorumflow-raft-snapshots >/dev/null 2>&1; then
            terraform import -var="region=$AWS_REGION"               aws_dynamodb_table.control_log quorumflow-raft-snapshots
          fi

          if aws ecr describe-repositories --repository-names quorumflow-runtime >/dev/null 2>&1; then
            terraform import -var="region=$AWS_REGION"               aws_ecr_repository.runtime quorumflow-runtime
          fi

      - name: Terraform plan
        if: steps.auth.outputs.ready == 'true'
        working-directory: infra/aws
        run: terraform plan -input=false -out=tfplan -var="region=$AWS_REGION"

      - name: Terraform apply
        if: steps.auth.outputs.ready == 'true'
        working-directory: infra/aws
        run: terraform apply -input=false -auto-approve tfplan

      - name: Record deployed resources
        if: steps.auth.outputs.ready == 'true'
        working-directory: infra/aws
        run: |
          terraform output -json | tee ../../aws-outputs.json
          {
            echo "### QuorumFlow AWS resources"
            echo '~~~json'
            cat ../../aws-outputs.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment receipt
        if: steps.auth.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quorumflow-aws-deployment-receipt
          path: |
            aws-identity.json
            aws-outputs.json
          if-no-files-found: error

      - name: Explain missing credentials
        if: steps.auth.outputs.ready != 'true'
        run: |
          echo "AWS deployment is wired but credentials are not configured in this repository."
          echo "Add either AWS_ROLE_ARN for OIDC or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY as repository secrets."
          echo "Then rerun this workflow."
