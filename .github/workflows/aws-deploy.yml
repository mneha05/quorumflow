name: Deploy AWS substrate

on:
  workflow_dispatch:
  push:
    paths:
      - "infra/aws/**"
      - ".github/workflows/aws-deploy.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: quorumflow-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Detect AWS authentication
        id: auth
        shell: bash
        run: |
          if [[ -n "$AWS_ROLE_ARN" ]]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "mode=static" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "mode=missing" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No AWS_ROLE_ARN or AWS access-key secrets are configured; Terraform apply is skipped."
          fi

      - name: Configure AWS through GitHub OIDC
        if: steps.auth.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        if: steps.auth.outputs.ready == 'true'
        run: |
          aws sts get-caller-identity | tee aws-identity.json
          echo "### AWS identity" >> "$GITHUB_STEP_SUMMARY"
          echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
          cat aws-identity.json >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform init
        if: steps.auth.outputs.ready == 'true'
        working-directory: infra/aws
        run: terraform init

      - name: Terraform plan
        if: steps.auth.outputs.ready == 'true'
        working-directory: infra/aws
        run: terraform plan -input=false -out=tfplan -var="region=$AWS_REGION"

      - name: Terraform apply
        if: steps.auth.outputs.ready == 'true'
        working-directory: infra/aws
        run: terraform apply -input=false -auto-approve tfplan

      - name: Record deployed resources
        if: steps.auth.outputs.ready == 'true'
        working-directory: infra/aws
        run: |
          terraform output -json | tee ../../aws-outputs.json
          {
            echo "### QuorumFlow AWS resources"
            echo '~~~json'
            cat ../../aws-outputs.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment receipt
        if: steps.auth.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quorumflow-aws-deployment-receipt
          path: |
            aws-identity.json
            aws-outputs.json
          if-no-files-found: error

      - name: Explain missing credentials
        if: steps.auth.outputs.ready != 'true'
        run: |
          echo "AWS deployment is wired but credentials are not configured in this repository."
          echo "Add either AWS_ROLE_ARN for OIDC or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY as repository secrets."
          echo "Then rerun this workflow."
