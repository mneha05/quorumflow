name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Consensus tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q quorumflow ml streaming batch
      - name: Hadoop Streaming contract
        run: |
          python batch/mapper.py < samples/telemetry.jsonl \
            | sort \
            | python batch/reducer.py \
            | tee /tmp/baselines.jsonl
          test "$(wc -l < /tmp/baselines.jsonl)" -eq 2
          grep -q '"device_id":"edge-04"' /tmp/baselines.jsonl
          grep -q '"device_id":"edge-17"' /tmp/baselines.jsonl
      - name: Browser simulator syntax
        run: node --check web/app.js

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [aws, azure, gcp]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format
        run: terraform fmt -check -recursive infra
      - name: Initialize ${{ matrix.root }}
        working-directory: infra/${{ matrix.root }}
        run: terraform init -backend=false
      - name: Validate ${{ matrix.root }}
        working-directory: infra/${{ matrix.root }}
        run: terraform validate

  tensorflow-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - name: Train a small model
        run: python ml/train.py --rows 256 --epochs 1 --output /tmp/quorumflow-model
      - name: Verify the exported artifact
        run: test -s /tmp/quorumflow-model/model.keras && test -s /tmp/quorumflow-model/metadata.json
