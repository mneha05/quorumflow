    <text x="73" y="253" text-anchor="middle" font-size="11" fill="#edf2ff">eu-west</text><text x="73" y="269" text-anchor="middle" font-size="8" fill="#7e8ba3">FOLLOWER</text>
    <text x="274" y="253" text-anchor="middle" font-size="11" fill="#edf2ff">ap-south</text><text x="274" y="269" text-anchor="middle" font-size="8" fill="#7e8ba3">FOLLOWER</text>
    <g transform="translate(105 310)"><rect width="143" height="28" rx="6" fill="#101827" stroke="#263248"/><circle cx="15" cy="14" r="4" fill="#60f5df"/><text x="28" y="18" font-size="9" fill="#aeb9ce">model=v18 committed</text></g>
