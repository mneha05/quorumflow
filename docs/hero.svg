<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">QuorumFlow</title>
  <desc id="desc">Failure-aware streaming machine learning across three cloud regions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1422"/><stop offset="1" stop-color="#070a10"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60f5df"/><stop offset=".55" stop-color="#6ca7ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#60f5df" stop-opacity=".22"/><stop offset="1" stop-color="#60f5df" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#9babc4" stroke-opacity=".05"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="997" cy="122" r="210" fill="url(#halo)"/>
