    </g>
    <g transform="translate(73 214)"><circle r="21" fill="none" stroke="#6ca7ff" stroke-opacity=".35"/><circle r="12" fill="#6ca7ff"/></g>
    <g transform="translate(274 214)"><circle r="21" fill="none" stroke="#6ca7ff" stroke-opacity=".35"/><circle r="12" fill="#6ca7ff"/></g>
