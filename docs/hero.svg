      <text x="47" y="23" font-size="16" font-weight="700" fill="#eef3ff">QuorumFlow</text>
    </g>
    <text x="66" y="166" font-size="55" font-weight="680" letter-spacing="-2.5" fill="#edf2ff">Streaming intelligence</text>
    <text x="66" y="224" font-size="55" font-weight="680" letter-spacing="-2.5" fill="url(#word)">that survives failure.</text>
    <text x="67" y="273" font-size="16" fill="#95a2ba">TensorFlow · Flink event time · Hadoop history · Raft consensus · three clouds</text>
